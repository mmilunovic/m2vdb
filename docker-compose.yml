services:
  m2vdb:
    build: .
    container_name: m2vdb
    ports:
      - "8000:8000"
    volumes:
      - m2vdb-data:/data
    environment:
      - M2VDB_DATA_DIR=/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  m2vdb-data:

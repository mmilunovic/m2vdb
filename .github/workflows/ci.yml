name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-smoke:
    name: Lint & Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Build Rust extension
        run: uv run maturin develop --release --manifest-path rust/Cargo.toml

      - name: Smoke Test (Import Check)
        run: uv run python -c "import m2vdb; print('Successfully imported m2vdb!')"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Unit Tests
        run: uv run pytest tests/unit/ -v

  integration-tests:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker compose build

      - name: Run End-to-End Tests
        run: ./tests/run_e2e_tests.sh

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

  persistence-tests:
    name: Persistence Tests (Docker)
    runs-on: ubuntu-latest
    needs: lint-and-smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker compose build

      - name: Run Persistence Tests
        run: ./tests/run_persistence_tests.sh

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs
